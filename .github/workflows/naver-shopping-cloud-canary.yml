name: N Shopping Cloud Canary

on:
  workflow_dispatch:

concurrency:
  group: naver-shopping-cloud-canary
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect-300-without-saving:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MI_NAVER_SHOPPING_CLOUD_CANARY_KEYWORD: "온열찜질기"
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install pinned collector dependencies
        run: npm --prefix tools/naver-shopping-rank-collector ci --ignore-scripts

      - name: Install pinned Chromium runtime
        run: tools/naver-shopping-rank-collector/node_modules/.bin/playwright install --with-deps chromium

      - name: Collect and validate 300 organic results without saving
        run: node scripts/naver-shopping-cloud-worker.mjs --canary-only

