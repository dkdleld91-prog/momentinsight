name: N Shopping Collector Canary

on:
  push:
    branches:
      - codex/naver-shopping-canary
  workflow_dispatch:

concurrency:
  group: naver-shopping-collector-canary-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-live-collector:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tools/naver-shopping-rank-collector
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/naver-shopping-rank-collector/package-lock.json

      - name: Install collector dependencies
        run: npm ci --ignore-scripts

      - name: Install matching Playwright Chromium
        run: npx --no-install playwright install --with-deps chromium

      - name: Verify live readiness and five-item canary
        shell: bash
        env:
          NAVER_SHOPPING_PROVIDER_MODE: playwright
          NAVER_SHOPPING_PROVIDER_HEADLESS: "true"
          NAVER_SHOPPING_PROVIDER_CANARY_KEYWORD: "온열찜질기"
          NAVER_SHOPPING_PROVIDER_CANARY_LIMIT: "5"
          NAVER_SHOPPING_PROVIDER_TIMEOUT_MS: "90000"
          PORT: "8798"
        run: |
          set -euo pipefail

          collector_secret="$(openssl rand -hex 32)"
          collector_pid=""

          cleanup() {
            if [ -n "${collector_pid}" ] && kill -0 "${collector_pid}" 2>/dev/null; then
              kill "${collector_pid}" 2>/dev/null || true
              wait "${collector_pid}" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT INT TERM

          NAVER_SHOPPING_RANK_COLLECTOR_SECRET="${collector_secret}" \
            node src/server.mjs >"${RUNNER_TEMP}/naver-shopping-collector.log" 2>&1 &
          collector_pid="$!"

          COLLECTOR_SECRET="${collector_secret}" node --input-type=module <<'NODE'
          const origin = "http://127.0.0.1:8798";
          const keyword = "온열찜질기";
          const limit = 5;
          const secret = process.env.COLLECTOR_SECRET || "";
          const pendingReasons = new Set([
            "startup_canary_pending",
            "readiness_verification_pending",
            "readiness_verification_stale",
            "naver_http_429",
            "provider_deadline_exceeded",
          ]);

          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          const safeReason = (value, fallback) => {
            const normalized = String(value || fallback || "unknown")
              .replace(/[\u0000-\u001f\u007f]/gu, " ")
              .slice(0, 160);
            return normalized || "unknown";
          };
          const report = (status, reason, count) => {
            const safe = safeReason(reason);
            console.log(JSON.stringify({ status, reason: safe, count }));
            if (status === "failed") {
              const annotation = safe.replace(/%/gu, "%25").replace(/\r/gu, "%0D").replace(/\n/gu, "%0A");
              console.log(`::error title=N Shopping Canary::${annotation}`);
            }
          };

          try {
            const waitUntil = Date.now() + 100_000;
            let readiness = null;
            let reason = "collector_starting";

            while (Date.now() < waitUntil) {
              try {
                const response = await fetch(`${origin}/ready`, {
                  headers: { accept: "application/json" },
                  signal: AbortSignal.timeout(5_000),
                });
                readiness = await response.json().catch(() => null);
                reason = safeReason(readiness?.provider?.reason, `readiness_http_${response.status}`);
                if (response.ok && readiness?.ready === true && readiness?.provider?.verified === true) break;
                if (reason && !pendingReasons.has(reason)) break;
              } catch {
                reason = "collector_unreachable";
              }
              await sleep(2_000);
            }

            if (readiness?.ready !== true || readiness?.provider?.verified !== true) {
              report("failed", reason, 0);
              process.exit(1);
            }

            const response = await fetch(`${origin}/rank/naver-shopping`, {
              method: "POST",
              headers: {
                authorization: `Bearer ${secret}`,
                "content-type": "application/json",
              },
              body: JSON.stringify({
                schemaVersion: "mi.naver-shopping-organic-window.v1",
                keyword,
                limit,
                sort: "relevance",
                rankPolicy: "organic_only",
                deadlineAt: new Date(Date.now() + 90_000).toISOString(),
                requestId: `github-canary-${Date.now()}`,
              }),
              signal: AbortSignal.timeout(95_000),
            });
            const payload = await response.json().catch(() => null);
            const count = Number.isInteger(payload?.checkedCount) ? payload.checkedCount : 0;
            const verified = response.ok
              && payload?.complete === true
              && payload?.keyword === keyword
              && count === limit
              && Array.isArray(payload?.items)
              && payload.items.length === limit;

            report(
              verified ? "verified" : "failed",
              verified ? "ok" : safeReason(payload?.detail || payload?.message, `canary_http_${response.status}`),
              count,
            );
            if (!verified) process.exit(1);
          } catch (error) {
            report("failed", error?.name === "TimeoutError" ? "canary_timeout" : error?.message, 0);
            process.exit(1);
          }
          NODE
