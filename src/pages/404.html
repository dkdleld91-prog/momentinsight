<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>페이지를 찾을 수 없습니다 | 모먼트 인사이트</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<style>
  :root { --bg: #f4f6fa; --panel: #fff; --ink: #111827; --navy: #061a3a; --muted: #667085; --line: #dfe5ef; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; background: var(--bg); color: var(--ink); font-family: -apple-system, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", system-ui, sans-serif; line-height: 1.55; }
  .card { width: min(560px, 100%); padding: 32px 28px; border: 1px solid var(--line); border-radius: 16px; background: var(--panel); box-shadow: 0 16px 38px rgba(6, 26, 58, 0.07); }
  .brand { display: inline-flex; align-items: center; gap: 10px; color: var(--navy); font-weight: 800; text-decoration: none; }
  .mark { display: inline-grid; place-items: center; width: 36px; height: 36px; border-radius: 10px; background: var(--navy); color: #fff; font-size: 13px; letter-spacing: -0.5px; }
  h1 { margin: 22px 0 8px; font-size: 24px; letter-spacing: -0.02em; color: var(--navy); }
  p { margin: 0 0 20px; color: var(--muted); font-size: 15px; }
  .links { display: flex; flex-wrap: wrap; gap: 8px; }
  .btn { display: inline-block; padding: 10px 14px; border: 1px solid var(--line); border-radius: 10px; background: #fff; color: var(--navy); font-weight: 700; font-size: 14px; text-decoration: none; }
  .btn.primary { background: var(--navy); border-color: var(--navy); color: #fff; }
  .btn:hover { border-color: var(--navy); }
</style>
</head>
<body>
  <main class="card">
    <a class="brand" href="/"><span class="mark">MI</span><span>모먼트 인사이트</span></a>
    <h1>페이지를 찾을 수 없습니다.</h1>
    <p>주소가 바뀌었거나 잘못 입력된 것 같습니다. 아래에서 이어 가세요.</p>
    <nav class="links" aria-label="바로가기">
      <a class="btn primary" href="/">홈으로</a>
      <a class="btn" href="/news">셀러 뉴스</a>
      <a class="btn" href="/client?signup=1">무료 체험 가입</a>
      <a class="btn" href="/client">로그인</a>
    </nav>
  </main>
</body>
</html>
